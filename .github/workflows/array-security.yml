name: Array exercise security tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and safe DOM output
        run: |
          node --check main.js
          node <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const js=fs.readFileSync('main.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          assert.ok(!/document\.write\s*\(/.test(js),'document.write remains');
          assert.ok(js.includes('item.textContent = String(texto)'));
          assert.ok(html.includes('id="resultado-arrays"'));
          console.log('Static checks passed');
          JS
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test country output and HTML injection in Chromium
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const path=require('node:path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('file://'+path.resolve('index.html'),{waitUntil:'domcontentloaded'});
              const output=page.locator('#resultado-arrays');
              const lines=output.locator('li');
              assert.ok(await lines.count()>100,'Country list is unexpectedly short');
              const text=await output.innerText();
              assert.ok(text.includes('México ->'),'Missing country');
              assert.ok(text.includes('se repite'),'Missing duplicate counts');
              assert.ok(text.includes('Total de paises:'),'Missing total');
              assert.deepEqual(errors,[],'JavaScript runtime errors');
              const payload='<img src=x onerror=alert(1)>';
              await page.evaluate(value=>mostrarLinea(value),payload);
              assert.equal(await lines.last().textContent(),payload);
              assert.equal(await output.locator('img').count(),0,'HTML injection');
              console.log('Country list, duplicate count and safe text rendering passed');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
